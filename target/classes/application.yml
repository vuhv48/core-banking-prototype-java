spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/account_demo
    username: postgres
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

security:
  jwt:
    # Thay bằng chuỗi ngẫu nhiên >= 32 ký tự trước khi deploy production
    secret: "change-me-to-a-very-long-secret-key-32chars!"
    # Thời gian sống access token: 15 phút (ms)
    access-token-ms: 900000
    # Thời gian sống refresh token: 7 ngày (ms)
    refresh-token-ms: 604800000
  # Danh sách endpoint không cần JWT (permitAll).
  # Thêm path mới ở đây mà không cần sửa code Java.
  public-paths:
    - /api/auth/login
    - /api/auth/refresh
